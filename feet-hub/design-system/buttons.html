<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#140910;padding:34px;font-family:Inter,sans-serif;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .btn{border:none;border-radius:999px;font-weight:600;font-size:15px;padding:14px 28px;cursor:pointer}
  .rose{background:linear-gradient(135deg,#FF3D6E,#C81E54);color:#fff;box-shadow:0 6px 24px -6px rgba(255,61,110,.35)}
  .ghost{background:transparent;color:#F6E9EC;border:1px solid rgba(255,61,110,.2)}
  .small{padding:9px 20px;font-size:14px}
</style></head><body>
  <button class="btn rose">Explorer</button>
  <button class="btn ghost">Découvrir les créateurs</button>
  <button class="btn rose small">Je m'abonne</button>
  <button class="btn ghost small">Passer ▸</button>
</body></html>
