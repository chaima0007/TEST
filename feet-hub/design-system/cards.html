<!-- @dsCard group="Components" name="Cartes" -->
<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;1,700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#140910;padding:30px;font-family:Inter,sans-serif;color:#F6E9EC;display:flex;gap:18px;flex-wrap:wrap}
  .serif{font-family:"Playfair Display",serif}
  .cat{width:200px;border:1px solid rgba(255,61,110,.2);border-radius:16px;padding:24px;background:linear-gradient(160deg,#1c0f18,transparent)}
  .cat .ic{font-size:26px;margin-bottom:10px}
  .cat h3{margin:0 0 6px;font-size:18px}
  .cat span{color:#B79AA4;font-size:13px}
  .card{width:230px;border:1px solid rgba(255,61,110,.2);border-radius:18px;overflow:hidden;background:#1c0f18}
  .thumb{aspect-ratio:4/3;background:linear-gradient(135deg,rgba(255,61,110,.28),rgba(28,15,24,.9));display:flex;align-items:center;justify-content:center;color:#FF7FA0;font-family:"Playfair Display",serif;font-style:italic;font-size:42px;position:relative}
  .tag{position:absolute;top:12px;left:12px;font-size:11px;background:rgba(10,4,8,.6);border:1px solid rgba(255,61,110,.2);color:#FF7FA0;padding:4px 10px;border-radius:999px}
  .body{padding:16px}
  .body h3{margin:0 0 6px;font-size:19px}
  .meta{color:#B79AA4;font-size:13px;margin-bottom:12px}
  .aff{display:block;text-align:center;background:linear-gradient(135deg,#FF3D6E,#C81E54);color:#fff;font-weight:600;font-size:14px;padding:10px;border-radius:10px}
</style></head><body>
  <div class="cat"><div class="ic">🤍</div><h3>Épuré &amp; sensuel</h3><span>Marbre, lumière douce</span></div>
  <div class="card"><div class="thumb">L<span class="tag">Populaire</span></div><div class="body"><h3>Lina</h3><div class="meta">Luxe &amp; bijoux</div><span class="aff">Voir le profil →</span></div></div>
</body></html>
