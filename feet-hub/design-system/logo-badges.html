<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Inter:wght@600&display=swap" rel="stylesheet">
<style>

  <div>
    <div class="logo">SO<span>LEA</span></div>

    <div style="margin-top:14px">
      <span class="tag">Pédicure soignée</span><span class="tag">Bas nylon</span><span class="tag">Sensuel chic</span>
