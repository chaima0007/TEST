  <style>
    :root{
      --paper:#fbfaf7; --ink:#141b26; --soft:#4a5768; --rule:#ddd8cd;
      --ok:#1a7a44; --err:#b03a2e; --amber:#8a6508;
      --code:#f2f1ec; --codeline:#e2ded4;
      --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
      --sans:system-ui,"Segoe UI","Helvetica Neue",sans-serif;
      --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
      -webkit-font-smoothing:antialiased}
    a{color:var(--ok)} a:hover{color:#145c33}
    .sheet{width:794px;height:1123px;padding:46px 52px 40px;display:flex;flex-direction:column;
      background:var(--paper)}
    .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
      color:var(--soft);display:flex;justify-content:space-between;align-items:baseline}
    .eyebrow b{color:var(--amber);font-weight:600}
    h1{font-family:var(--serif);font-size:34px;line-height:1.1;margin:10px 0 4px;letter-spacing:-.01em}
    .lede{font-size:15px;color:var(--soft);margin:0 0 16px;max-width:56ch;text-wrap:pretty}
    .hr{height:2px;background:var(--ink);margin:0 0 18px}
    h2{font-family:var(--sans);font-size:12px;letter-spacing:.13em;text-transform:uppercase;
      color:var(--soft);margin:0 0 8px;display:flex;align-items:center;gap:8px}
    h2::after{content:"";flex:1;height:1px;background:var(--rule)}
    section{margin-bottom:15px}
    code,.cmd{font-family:var(--mono);font-size:13px}
    .cmd{background:var(--code);border:1px solid var(--codeline);border-radius:3px;
      padding:1px 5px;white-space:nowrap}
    .block{font-family:var(--mono);font-size:13px;line-height:1.65;background:var(--code);
      border:1px solid var(--codeline);border-left:3px solid var(--ok);border-radius:3px;
      padding:10px 12px;white-space:pre-wrap}
    .grid{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
    .grid>div{background:var(--paper);padding:7px 9px;font-size:13.5px;line-height:1.4}
    .grid .h{background:#efece5;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
      color:var(--soft);font-weight:600;padding:6px 9px}
    .grid .m{font-family:var(--mono);font-size:12.5px}
    .steps{display:flex;flex-direction:column;gap:7px}
    .step{display:flex;gap:11px;align-items:flex-start}
    .num{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--paper);background:var(--ink);
      width:21px;height:21px;border-radius:11px;display:flex;align-items:center;justify-content:center;
      flex:0 0 auto;margin-top:1px}
    .step .body{flex:1;font-size:13.5px;line-height:1.45}
    .step .body .q{color:var(--soft)}
    .warn{border:1px solid var(--err);border-left:4px solid var(--err);border-radius:3px;
      padding:10px 13px;font-size:13.5px;line-height:1.5}
    .warn .t{font-weight:700;color:var(--err);font-size:11px;letter-spacing:.12em;
      text-transform:uppercase;margin-bottom:5px}
    .warn ul{margin:0;padding-left:17px} .warn li{margin:3px 0}
    .note{font-size:13px;color:var(--soft);line-height:1.5;margin:7px 0 0}
    .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--rule);
      display:flex;justify-content:space-between;font-size:11px;color:var(--soft);
      font-family:var(--mono);letter-spacing:.06em}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .sheet.compact section{margin-bottom:11px}
    .sheet.compact .grid>div{padding:5px 9px}
    .sheet.compact .grid .h{padding:5px 9px}
    .sheet.compact .block{line-height:1.5;padding:8px 12px}
    .sheet.compact .lede{margin-bottom:13px}
    .sheet.compact h1{margin:8px 0 4px}
    .sheet.compact .warn li{margin:2px 0}
    .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);
      font-weight:600;margin-bottom:5px}
    .ok{color:var(--ok);font-weight:600}
    .bad{color:var(--err);font-weight:600}
  </style>
